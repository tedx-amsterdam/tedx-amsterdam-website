name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded pull request runs are cancelled to save time; runs on main
# always finish, so every commit there gets a full result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # CI never sees a CMS token: it builds and tests on fixture content.
    env:
      CONTENT_SOURCE: fixtures
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit check reads the pull request's commits from history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check commit messages and branch name
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: node scripts/git-workflow.ts "$BASE" "$HEAD" "$BRANCH"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:output
