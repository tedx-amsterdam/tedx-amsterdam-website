name: Lighthouse

# Runs Lighthouse against the Cloudflare preview of every pull request, so
# performance, accessibility, SEO and best practices are measured on the
# real build, served with Cloudflare's headers and compression.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: read

concurrency:
  group: lighthouse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lighthouse:
    # Cloudflare does not build pull requests from forks, so there is no
    # preview to test.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Wait for Cloudflare preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(.github/scripts/cloudflare-preview-url.sh "$GITHUB_REPOSITORY" "${{ github.event.pull_request.head.sha }}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Testing preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          # Add one URL per page type as pages are built.
          urls: |
            ${{ steps.preview.outputs.url }}/
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
