name: PR attention

# Posts one comment on every pull request listing what needs a person's
# judgment (scripts/pr-attention.ts), and updates it on every push. It
# reports only and never fails the pull request, so it is not a required
# check.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-attention-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    # Pull requests from forks get a read-only token and cannot comment.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: List what needs attention
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr-attention.ts "$BASE" "$HEAD" > "$RUNNER_TEMP/attention.md"
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- pr-attention -->")) | .id' | head -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/attention.md" > /dev/null
          else
            gh pr comment "$NUMBER" --body-file "$RUNNER_TEMP/attention.md"
          fi
